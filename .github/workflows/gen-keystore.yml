name: 生成 CI 签名钥（一次性工具）

# 触发方式：推送到 docs/KEYSTORE_REGENERATE.md（该文件内容任意）。
# 作用：在 runner 上用其自带 keytool 生成 Java 原生 JKS 签名钥
# （OpenSSL 3.5 生成的 PKCS12 与 Java 17 读取器存在兼容死结——密码
# 正确也报 password incorrect，见 ci.yml 排障记录），产物上传为
# artifact，下载后经 CV_KEYSTORE_B64 secret 注入正式构建。
# 密钥参数与 build.gradle.kts 内置值一致（storepass/keypass/alias）。

on:
  push:
    paths: ['docs/KEYSTORE_REGENERATE.md']
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: keytool 生成 JKS
        run: |
          keytool -genkeypair -noprompt \
            -alias clipvault -keyalg RSA -keysize 2048 -validity 10950 \
            -keystore clipvault-ci.jks -storetype JKS \
            -storepass ClipVaultCI2026 -keypass ClipVaultCI2026 \
            -dname "CN=ClipVault CI Release"
          echo "--- 自验证（同机 keytool 读回）---"
          keytool -list -v -keystore clipvault-ci.jks -storepass ClipVaultCI2026 2>/dev/null | head -16
          echo "--- sha256 ---"
          sha256sum clipvault-ci.jks
          echo "--- base64（也可直接从日志取）---"
          base64 -w0 clipvault-ci.jks

      - name: 上传产物（30 天有效）
        uses: actions/upload-artifact@v7
        with:
          name: ci-keystore-jks
          path: clipvault-ci.jks
          if-no-files-found: error
