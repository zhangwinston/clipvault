# ClipVault CI：静态检查+单测（每次推送）→ Android APK / iOS 未签名 IPA（main）
#
# 说明：
# - iOS 产物为 --no-codesign 的未签名 IPA/XCArchive（安装需自签或企业/商店签名；
#   如后续提供 Apple 开发者证书，可经 secrets 注入 fastlane/gym 签名）。
# - Android release APK 默认 debug 签名可直接侧载安装；上架 Play 需配置签名密钥。
# - 测试语料 test/resources/token_corpus.csv 不入库，由 tools/token_corpus.mjs
#   确定性再生（seed=42，README §二）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    name: 分析 + 单元/Widget 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 依赖解析
        run: flutter pub get

      - name: 再生 token 语料（10 万行，seed=42）
        run: node tools/token_corpus.mjs

      - name: 契约校验（夹具 ↔ resolve.schema.json）
        run: node tools/check_contract.mjs

      - name: 静态分析（strict-casts/raw-types/inference）
        run: flutter analyze

      - name: 测试（单测 + Widget，离线）
        run: flutter test

  android-apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # media_kit 的 gradle 硬编码下载全部 4 个 ABI 的 libmpv jar（~40MB，
      # 无上游开关；MD5 校验后复用）+ gradle 依赖本身也每次重拉——
      # 缓存这三处，命中后 Android 作业显著提速。
      - name: 缓存 gradle 依赖与 media_kit libmpv jar
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-*/android/build
          key: android-gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - name: 依赖解析
        run: flutter pub get

      - name: Release APK（仅 arm64）
        # --target-platform 才是 ABI 的真开关：gradle 的 ndk.abiFilters
        # 管不住 Flutter 插件自行塞入的 libflutter/libapp/libmpv（实测
        # armeabi-v7a 仍整包打入）。用户决策：放弃 32 位老机型，单包。
        run: flutter build apk --release --target-platform android-arm64

      - name: 原生库清单（可见性：确认 sqlite3/media_kit 等 .so 均已打包）
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E "\.so" | awk '{print $4, "("$1" bytes)"}'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-ipa:
    name: iOS 未签名 IPA
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 依赖解析
        run: flutter pub get

      - name: 清理 SwiftPM 缓存（规避 runner 缓存偶发损坏）
        # sqlite3_flutter_libs 经 SPM 拉取 CSQLite；GitHub macOS runner 的
        # ~/Library/Caches/org.swift.swiftpm 偶发残留指向已删除仓库的缓存条目，
        # 使 xcodebuild 解析依赖 fatal（同代码同配置约 1/4 概率复现）。
        # 构建前强制清缓存走全新 clone，彻底规避。
        run: rm -rf ~/Library/Caches/org.swift.swiftpm || true

      - name: Release 构建（无签名 xcarchive）
        run: flutter build ipa --release --no-codesign

      - name: 打包未签名 IPA（xcarchive → Payload 打包）
        # flutter build ipa --no-codesign 在无签名环境只产 xcarchive 不导出
        # IPA（跳过 ExportOptions 步骤），此处按社区标准做法手工打包：
        # Runner.app → Payload/ → zip 为可被 Sideloadly/AltStore 重签的 IPA
        run: |
          mkdir -p build/ios/payload/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
            build/ios/payload/Payload/Runner.app
          (cd build/ios/payload && zip -qry ../clipvault-unsigned.ipa Payload)
          ls -lh build/ios/clipvault-unsigned.ipa

      - name: 上传产物（未签名 IPA）
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-ios-unsigned
          path: build/ios/clipvault-unsigned.ipa
          if-no-files-found: error

  release:
    name: 持续集成发布（rolling release）
    needs: [test, android-apk, ios-ipa]
    # PR 构建不发 release；push main / 手动触发时滚动更新
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: clipvault-*
          path: dist
          merge-multiple: true

      - name: 整理产物（find 定位，不依赖 artifact 内部结构）
        run: |
          APK=$(find dist -name "app-release.apk" | head -1)
          IPA=$(find dist -name "*.ipa" | head -1)
          if [ -z "$APK" ] || [ -z "$IPA" ]; then
            echo "产物缺失：APK='$APK' IPA='$IPA'"; find dist -type f | head -20; exit 1
          fi
          mv "$APK" clipvault-android.apk
          mv "$IPA" clipvault-ios-unsigned.ipa
          ls -lh clipvault-*

      - name: 刷新 continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="## 持续集成构建
          提交：\`${GITHUB_SHA:0:7}\`
          构建时间：$(date '+%Y-%m-%d %H:%M UTC')

          | 产物 | 说明 |
          |---|---|
          | \`clipvault-android.apk\` | Release 构建 · debug 签名（可直接侧载安装；上架商店需替换正式签名） |
          | \`clipvault-ios-unsigned.ipa\` | Release 构建 · **未签名**（安装需自签：AltStore / Sideloadly / 企业证书） |

          > 本 release 随 main 每次推送滚动更新：标签 \`continuous\` 始终指向最新构建，历史版本请到 [Actions](https://github.com/zhangwinston/clipvault/actions) 构建产物区。"
          # 滚动标签：删除旧 release+tag 后在当前提交重建，保证 continuous 指向最新
          # （本作业无 checkout，gh 需 --repo 显式指定仓库而非从 git 远端推断）
          REPO="${{ github.repository }}"
          gh release delete continuous --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create continuous clipvault-android.apk clipvault-ios-unsigned.ipa \
            --repo "$REPO" \
            --title "持续集成构建（continuous）" \
            --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
