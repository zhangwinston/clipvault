name: clipvault
description: "ClipVault - X(Twitter) 视频下载工具（个人备份用途，纯客户端解析）"
# 防止误发布到 pub.dev（内部项目）
publish_to: 'none'

# Android: build-name = versionName, build-number = versionCode
# iOS: build-name = CFBundleShortVersionString, build-number = CFBundleVersion
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # ---- 网络层（DESIGN §9-2：dio 而非 http —— 流式下载 + Range + 取消 + 超时一体化）----
  dio: 5.11.1

  # ---- 状态管理（DESIGN §9-1：AsyncNotifier 解析流 / StreamProvider 任务+历史双流）----
  flutter_riverpod: 3.4.3

  # ---- 持久化（DESIGN §9-3：drift 而非 isar/hive；executor 注入设计支持测试内存库）----
  drift: 2.35.0
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: 2.5.5

  # ---- 相册保存（DESIGN §9-4：gal —— BSD-3、verified publisher、LocalSend 同款）----
  gal: 2.3.3

  # ---- 平台路径（DESIGN §5.5：appDocuments/xdown.db + appDocuments/downloads）----
  path_provider: ^2.1.6

  # ---- 网络连接类型（仅 Wi-Fi 下载偏好：入队前检查，默认关闭）----
  connectivity_plus: ^7.3.1

  # ---- 分享接收（P1：Android intent-filter / iOS Share Extension）----
  receive_sharing_intent: 1.9.0

  # ---- Material 内置文案中文化（§9-12 文案收口：Close tooltip 等）----
  flutter_localizations:
    sdk: flutter

  # ---- 内置播放器（P1）----
  # video_player 2.14.0（ExoPlayer/media3 后端）在颜色元数据未指定的视频上
  # 初始化必败（PlatformException: Unset color range/Unset color transfer，
  # flutter/flutter#81804 关联族系，X CDN 的 MP4 普遍无色彩信息）→ 触发
  # DESIGN §9-5 预设的候补路线：media_kit（libmpv 后端对缺失色彩元数据
  # 宽容）。注：media_kit 1.2.x 已移除 video_player 兼容层，播放器页使用
  # 其原生 API（Player/VideoController/Video），见 lib/player/player_screen.dart。
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7

  # ---- 前台进度通知（P1-Android ForegroundService 常驻通知）----
  flutter_local_notifications: 22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # lint 基线 + strict 模式见 analysis_options.yaml（strict-casts / strict-raw-types / strict-inference）
  flutter_lints: ^6.0.0

  # 时序类单测（backoff 退避序列断言）经 flutter_test 传递解析，此处显式声明避免 depend_on_referenced_packages
  fake_async: ^1.3.3

  # drift 代码生成（集中验证阶段统一执行 build_runner）
  drift_dev: ^2.35.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    # 内置端点配置预设（DESIGN §6.7，可被远端版本原子替换；
    # 运行时经 rootBundle 加载，是端点热更的第一级来源）
    - assets/config/
    # 注：assets/fixtures/ 仅测试用（测试经 File I/O 直接读盘，CWD=工程根），
    # 不随发布包打进去（含真实第三方录制数据，§8.4 最小交付）。
